name: Signed JS Diary Android Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.JS_DIARY_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.JS_DIARY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JS_DIARY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JS_DIARY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "::error::Release signing secrets are missing"; exit 1; }
      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify release APK
        env:
          KEYSTORE_B64: ${{ secrets.JS_DIARY_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.JS_DIARY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JS_DIARY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JS_DIARY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jsdiary-release.jks"
          apk="$(find app/build/outputs/apk/release -name '*unsigned.apk' -type f | head -n 1)"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          export KS_PASS="$KEYSTORE_PASS" PRIVATE_KEY_PASS="$KEY_PASS"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/jsdiary-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:PRIVATE_KEY_PASS --out JS-Diary-release.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs JS-Diary-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging JS-Diary-release.apk | grep "package: name='com.jsdiary.app'"
          sha256sum JS-Diary-release.apk > JS-Diary-release.sha256
          rm -f "$RUNNER_TEMP/jsdiary-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: JS-Diary-signed-release
          path: |
            JS-Diary-release.apk
            JS-Diary-release.sha256
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-release-${{ github.run_number }}" JS-Diary-release.apk JS-Diary-release.sha256 --title "JS다이어리 서명된 안드로이드 릴리스" --notes "서명 및 패키지 검증 완료. 실제 기기 설치 및 Play Protect 검사는 별도입니다." --prerelease
