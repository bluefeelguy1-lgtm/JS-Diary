name: Build JS Diary APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: js-diary-apk-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK and capture errors
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-log.txt
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JS-Diary-build-log
          path: build-log.txt
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JS-Diary-Android-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest test APK as GitHub release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$apk"
          cp "$apk" JS-Diary-latest.apk
          test -s JS-Diary-latest.apk
          if gh release view js-diary-latest >/dev/null 2>&1; then
            gh release upload js-diary-latest JS-Diary-latest.apk --clobber
          else
            gh release create js-diary-latest JS-Diary-latest.apk JS-Diary-browser.html --title "JS다이어리 최신 테스트 APK" --notes "테스트용 APK입니다. Firebase 보안 규칙이 게시되기 전까지 클라우드 기능이 동작하지 않을 수 있습니다." --prerelease
          fi
