<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>JS 다이어리</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#29233a;background:#faf7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#7253aa,#e48fb4);color:white;padding:32px 22px 24px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:28px}header p{opacity:.9}main{padding:18px;max-width:650px;margin:auto}nav{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px}button{border:0;border-radius:13px;padding:12px 15px;background:#eae1f4;color:#51347b;font-weight:700;white-space:nowrap}button.active,.primary{background:#7253aa;color:white}section{display:none}section.active{display:block}.card{background:white;border-radius:19px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #39234c0d}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #ded6e5;border-radius:11px;margin:7px 0;background:white}textarea{min-height:110px}h2{font-size:21px}small,.muted{color:#7b7286}.entry{border-top:1px solid #eee;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row input{width:auto;flex:1}.danger{background:#ffe5e7;color:#a43446}.balance{font-size:26px;font-weight:800;color:#7253aa}</style></head><body><header><h1>♡ JS 다이어리</h1><p>우리의 하루, 나의 기록 · 개인 기기 저장형 베타</p></header><main><nav><button class="active" onclick="tab('diary',this)">일기</button><button onclick="tab('money',this)">가계부</button><button onclick="tab('dday',this)">기념일</button><button onclick="tab('letter',this)">마음편지</button><button onclick="tab('settings',this)">설정</button></nav>
<section id="diary" class="active"><div class="card"><h2>오늘의 일기</h2><input id="diaryTitle" placeholder="오늘의 제목"><select id="mood"><option>😊 행복</option><option>🥰 설렘</option><option>😌 평온</option><option>😢 속상함</option><option>😠 화남</option></select><textarea id="diaryText" placeholder="오늘의 이야기를 남겨요"></textarea><button class="primary" onclick="addDiary()">일기 저장</button></div><div id="diaryList"></div></section>
<section id="money"><div class="card"><h2>개인 금전출납부</h2><div class="balance" id="balance">0원</div><select id="moneyType"><option value="expense">지출</option><option value="income">수입</option></select><input id="moneyAmount" type="number" min="1" placeholder="금액 (원)"><input id="moneyMemo" placeholder="사용 내역"><button class="primary" onclick="addMoney()">내역 저장</button></div><div id="moneyList"></div></section>
<section id="dday"><div class="card"><h2>우리의 기념일</h2><input id="dayTitle" placeholder="기념일 이름"><input id="dayDate" type="date"><button class="primary" onclick="addDay()">기념일 저장</button></div><div id="dayList"></div></section>
<section id="letter"><div class="card"><h2>마음 편지</h2><input id="letterTitle" placeholder="편지 제목"><textarea id="letterText" placeholder="전하고 싶은 마음을 적어주세요"></textarea><button class="primary" onclick="addLetter()">편지 저장</button></div><div id="letterList"></div></section>
<section id="settings"><div class="card"><h2>JS 다이어리 · 베타</h2><p>현재 기록은 이 휴대폰 앱 내부에만 저장됩니다. 앱 삭제나 데이터 초기화 시 기록이 사라질 수 있습니다.</p><p>커플 계정 연동, FOUNDER VIP 서버 인증, 사진 공유, SOS 위치 전송, 결제는 아직 구현되지 않았습니다.</p><button onclick="exportData()">기록 백업 내용 보기</button><textarea id="backup" readonly placeholder="백업 데이터"></textarea></div></section></main><script>
const $=id=>document.getElementById(id),key='jsdiary-beta-data';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}}for(const k of ['diary','money','dday','letter'])if(!Array.isArray(data[k]))data[k]=[];const save=()=>{localStorage.setItem(key,JSON.stringify(data));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tab(id,btn){document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function addDiary(){if(!$('diaryText').value.trim())return alert('일기를 입력해 주세요');data.diary.unshift({title:$('diaryTitle').value||'오늘의 일기',text:$('diaryText').value,mood:$('mood').value,date:new Date().toLocaleDateString('ko-KR')});$('diaryTitle').value=$('diaryText').value='';save()}
function addMoney(){const amount=Number($('moneyAmount').value);if(!(amount>0))return alert('금액을 입력해 주세요');data.money.unshift({type:$('moneyType').value,amount,memo:$('moneyMemo').value,date:new Date().toLocaleDateString('ko-KR')});$('moneyAmount').value=$('moneyMemo').value='';save()}
function addDay(){if(!$('dayDate').value)return alert('날짜를 선택해 주세요');data.dday.unshift({title:$('dayTitle').value||'기념일',date:$('dayDate').value});$('dayTitle').value=$('dayDate').value='';save()}
function addLetter(){if(!$('letterText').value.trim())return alert('편지를 입력해 주세요');data.letter.unshift({title:$('letterTitle').value||'마음 편지',text:$('letterText').value,date:new Date().toLocaleDateString('ko-KR')});$('letterTitle').value=$('letterText').value='';save()}
function remove(k,i){if(confirm('이 기록을 삭제할까요?')){data[k].splice(i,1);save()}}
function render(){for(const k of ['diary','money','dday','letter']){$(k==='dday'?'dayList':k+'List').innerHTML=data[k].map((x,i)=>{let info=k==='money'?((x.type==='income'?'수입 +':'지출 −')+Number(x.amount).toLocaleString()+'원 · '+esc(x.memo)):k==='dday'?('D'+(Math.ceil((new Date(x.date+'T00:00:00')-new Date().setHours(0,0,0,0))/86400000)>=0?'-':'+')+Math.abs(Math.ceil((new Date(x.date+'T00:00:00')-new Date().setHours(0,0,0,0))/86400000))):esc(x.mood||'')+' '+esc(x.text);return '<div class="card"><div class="row"><b>'+esc(x.title||x.date)+'</b><button class="danger" onclick="remove(\''+k+'\','+i+')">삭제</button></div><small>'+esc(x.date)+'</small><div class="entry">'+info+'</div></div>'}).join('')||'<p class="muted">아직 저장된 기록이 없습니다.</p>'}let balance=data.money.reduce((s,x)=>s+(x.type==='income'?1:-1)*x.amount,0);$('balance').textContent=balance.toLocaleString()+'원'}
function exportData(){$('backup').value=JSON.stringify(data,null,2);$('backup').select()}render();</script></body></html>
